<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra Dark Deep Space / Obsidian Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="40%" stop-color="#070c16" />
      <stop offset="70%" stop-color="#050810" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <!-- Radial Vignette for Depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(0, 245, 255, 0.06)" />
      <stop offset="50%" stop-color="rgba(0, 0, 0, 0)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.85)" />
    </radialGradient>

    <!-- Electric Cyan Glow Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <!-- Precision Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Technical Micro-Grid Pattern -->
    <pattern id="darkGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="0.8" />
      <circle cx="25" cy="25" r="0.75" fill="rgba(0, 245, 255, 0.15)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="300" rx="16" fill="url(#obsidianBg)" />
  <rect width="1000" height="300" rx="16" fill="url(#darkGrid)" />
  <rect width="1000" height="300" rx="16" fill="url(#vignette)" />

  <!-- Outer Precision Border -->
  <rect x="1" y="1" width="998" height="298" rx="15" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />
  
  <!-- Subtle Top & Bottom Glowing Laser Lines -->
  <path d="M 250 1 L 750 1" stroke="url(#electricCyan)" stroke-width="2" opacity="0.8" filter="url(#subtleGlow)" />
  <path d="M 350 299 L 650 299" stroke="url(#electricCyan)" stroke-width="1.5" opacity="0.6" />

  <!-- ==================== LEFT CIRCUITRY & HARDWARE SCHEMATIC ==================== -->
  <g opacity="0.65">
    <!-- Main IC Chip Outline -->
    <rect x="50" y="90" width="75" height="120" rx="8" fill="#060b14" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1.2" />
    <circle cx="87.5" cy="110" r="4" fill="#00f5ff" opacity="0.6" />
    <text x="87.5" y="150" fill="#00f5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ESP32</text>
    <text x="87.5" y="165" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="8" text-anchor="middle">MCU CORE</text>

    <!-- IC Pins (Left & Right) -->
    <path d="M 38 105 L 50 105 M 38 120 L 50 120 M 38 135 L 50 135 M 38 150 L 50 150 M 38 165 L 50 165 M 38 180 L 50 180 M 38 195 L 50 195" stroke="rgba(0, 245, 255, 0.5)" stroke-width="1.5" />
    <path d="M 125 105 L 137 105 M 125 120 L 137 120 M 125 135 L 137 135 M 125 150 L 137 150 M 125 165 L 137 165 M 125 180 L 137 180 M 125 195 L 137 195" stroke="rgba(0, 245, 255, 0.5)" stroke-width="1.5" />

    <!-- Circuit Bus Traces (Routing into the board) -->
    <g stroke="rgba(0, 245, 255, 0.35)" stroke-width="1.2" fill="none">
      <path d="M 137 120 L 180 120 L 210 90 L 260 90" />
      <circle cx="260" cy="90" r="3" fill="#00f5ff" />

      <path d="M 137 150 L 195 150 L 225 180 L 275 180" />
      <circle cx="275" cy="180" r="3" fill="#00f5ff" />

      <path d="M 137 180 L 170 180 L 195 215 L 240 215" />
      <circle cx="240" cy="215" r="2.5" fill="rgba(0, 245, 255, 0.6)" />

      <!-- Top decorative trace -->
      <path d="M 0 45 L 90 45 L 130 85 L 130 90" />
      <circle cx="90" cy="45" r="2.5" fill="#00f5ff" />
      
      <!-- Bottom decorative trace -->
      <path d="M 0 255 L 70 255 L 110 215 L 110 210" />
      <circle cx="70" cy="255" r="2.5" fill="#00f5ff" />
    </g>
  </g>

  <!-- ==================== RIGHT DIGITAL WAVEFORM & TELEMETRY ==================== -->
  <g opacity="0.65">
    <!-- Telemetry Data Card Outline -->
    <rect x="875" y="90" width="75" height="120" rx="8" fill="#060b14" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" />
    <text x="912.5" y="115" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" text-anchor="middle">&lt;DATA&gt;</text>
    
    <!-- Code / Pulse graphic inside card -->
    <path d="M 885 135 L 895 135 L 900 125 L 905 145 L 910 135 L 940 135" stroke="#818cf8" stroke-width="1.5" fill="none" />
    <path d="M 885 155 L 905 155 M 885 170 L 920 170 M 885 185 L 910 185" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round" />

    <!-- Waveform Traces Routing inward -->
    <g stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" fill="none">
      <path d="M 875 120 L 830 120 L 800 90 L 740 90" />
      <circle cx="740" cy="90" r="3" fill="#818cf8" />

      <path d="M 875 150 L 815 150 L 785 180 L 725 180" />
      <circle cx="725" cy="180" r="3" fill="#818cf8" />

      <path d="M 875 180 L 840 180 L 815 215 L 760 215" />
      <circle cx="760" cy="215" r="2.5" fill="rgba(99, 102, 241, 0.6)" />

      <!-- Top decorative trace -->
      <path d="M 1000 45 L 920 45 L 880 85 L 880 90" />
      <circle cx="920" cy="45" r="2.5" fill="#818cf8" />

      <!-- Bottom decorative trace -->
      <path d="M 1000 255 L 930 255 L 890 215 L 890 210" />
      <circle cx="930" cy="255" r="2.5" fill="#818cf8" />
    </g>
  </g>

  <!-- ==================== CENTER CONTENT ==================== -->

  <!-- Top Status Badge -->
  <g transform="translate(385, 26)">
    <rect x="0" y="0" width="230" height="24" rx="12" fill="rgba(0, 245, 255, 0.05)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#00f5ff" filter="url(#subtleGlow)" />
    <text x="122" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">
      HARDWARE &amp; WEB TELEMETRY
    </text>
  </g>

  <!-- Main Name Header (High-contrast, bold, executive) -->
  <text x="500" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="1.5">
    DIEGO SOUZA
  </text>

  <!-- Subtitle (Specialization & Domain) -->
  <text x="500" y="142" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    Engenharia de Sistemas Embarcados • IoT • Front-end Moderno
  </text>

  <!-- Stack Pills (Sleek dark containers with glowing borders) -->
  <g transform="translate(260, 168)">
    <!-- ESP32 -->
    <rect x="0" y="0" width="70" height="28" rx="6" fill="#09101c" stroke="rgba(231, 53, 44, 0.5)" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#e7352c" />
    <text x="42" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ESP32</text>

    <!-- Arduino -->
    <rect x="78" y="0" width="78" height="28" rx="6" fill="#09101c" stroke="rgba(0, 151, 157, 0.5)" stroke-width="1" />
    <circle cx="92" cy="14" r="3" fill="#00979d" />
    <text x="123" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Arduino</text>

    <!-- C/C++ -->
    <rect x="164" y="0" width="65" height="28" rx="6" fill="#09101c" stroke="rgba(0, 89, 156, 0.5)" stroke-width="1" />
    <circle cx="178" cy="14" r="3" fill="#00599c" />
    <text x="203" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">C/C++</text>

    <!-- TypeScript -->
    <rect x="237" y="0" width="90" height="28" rx="6" fill="#09101c" stroke="rgba(49, 120, 198, 0.5)" stroke-width="1" />
    <circle cx="251" cy="14" r="3" fill="#3178c6" />
    <text x="288" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">TypeScript</text>

    <!-- React -->
    <rect x="335" y="0" width="68" height="28" rx="6" fill="#09101c" stroke="rgba(97, 218, 251, 0.5)" stroke-width="1" />
    <circle cx="349" cy="14" r="3" fill="#61dafb" />
    <text x="374" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">React</text>

    <!-- MQTT / IoT -->
    <rect x="411" y="0" width="68" height="28" rx="6" fill="#09101c" stroke="rgba(102, 0, 102, 0.5)" stroke-width="1" />
    <circle cx="425" cy="14" r="3" fill="#a855f7" />
    <text x="450" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MQTT</text>
  </g>

  <!-- Bottom Telemetry & Location Footer -->
  <g transform="translate(290, 222)">
    <rect x="0" y="0" width="420" height="28" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text x="210" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1">
      ⚡ DO CIRCUITO À NUVEM  •  📍 MANAUS, BR
    </text>
  </g>

</svg>

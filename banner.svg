<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Accent Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Accent Neon Pink/Purple Gradient -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="260" rx="14" fill="url(#bgGrad)" />
  <rect width="1000" height="260" rx="14" fill="url(#techGrid)" />
  <rect width="1000" height="260" rx="14" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5" />

  <!-- Left Circuit Elements (IoT / Hardware) -->
  <g opacity="0.45" stroke="#00f2fe" stroke-width="1.5" fill="none">
    <path d="M 0 60 L 90 60 L 130 100 L 220 100" />
    <circle cx="220" cy="100" r="4" fill="#00f2fe" />

    <path d="M 0 160 L 70 160 L 110 120 L 170 120" />
    <circle cx="170" cy="120" r="3" fill="#00f2fe" />

    <path d="M 40 260 L 40 210 L 90 160 L 160 160 L 190 190 L 250 190" />
    <circle cx="250" cy="190" r="4" fill="#00f2fe" />

    <rect x="30" y="85" width="50" height="50" rx="6" stroke="#00f2fe" stroke-dasharray="4 3" opacity="0.6" />
    <text x="55" y="114" fill="#00f2fe" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">MCU</text>
  </g>

  <!-- Right Circuit / Code Elements (Web / Front-end) -->
  <g opacity="0.4" stroke="#f857a6" stroke-width="1.5" fill="none">
    <path d="M 1000 70 L 910 70 L 870 110 L 780 110" />
    <circle cx="780" cy="110" r="4" fill="#f857a6" />

    <path d="M 1000 180 L 930 180 L 890 140 L 820 140" />
    <circle cx="820" cy="140" r="3.5" fill="#f857a6" />

    <path d="M 960 260 L 960 220 L 910 170 L 840 170 L 810 200 L 750 200" />
    <circle cx="750" cy="200" r="4" fill="#f857a6" />

    <text x="910" y="115" fill="#f857a6" font-size="28" font-family="Courier, monospace" font-weight="bold" opacity="0.5">&lt;/&gt;</text>
  </g>

  <!-- Top Center Icons Floating -->
  <g transform="translate(385, 28)">
    <!-- ESP32 Pill -->
    <rect x="0" y="0" width="42" height="26" rx="6" fill="#e7352c" opacity="0.9" />
    <text x="21" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ESP</text>

    <!-- Arduino Pill -->
    <rect x="50" y="0" width="38" height="26" rx="6" fill="#00979d" opacity="0.9" />
    <text x="69" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">∞</text>

    <!-- C++ Pill -->
    <rect x="96" y="0" width="38" height="26" rx="6" fill="#00599c" opacity="0.9" />
    <text x="115" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">C++</text>

    <!-- TS Pill -->
    <rect x="142" y="0" width="38" height="26" rx="6" fill="#3178c6" opacity="0.9" />
    <text x="161" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TS</text>

    <!-- React Pill -->
    <rect x="188" y="0" width="42" height="26" rx="6" fill="#20232a" stroke="#61dafb" stroke-width="1" />
    <text x="209" y="17" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚛</text>
  </g>

  <!-- Main Headline -->
  <text x="500" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    Olá, eu sou Diego Souza 👋
  </text>

  <!-- Subtitle -->
  <text x="500" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0.3">
    Desenvolvedor de Sistemas Embarcados, IoT &amp; Front-end
  </text>

  <!-- Tagline / Location Badge -->
  <g transform="translate(370, 175)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="130" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      ⚡ Do Hardware à Tela • 📍 Manaus, Brasil
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="228" width="300" height="3" rx="1.5" fill="url(#neonCyan)" opacity="0.8" />
</svg>
